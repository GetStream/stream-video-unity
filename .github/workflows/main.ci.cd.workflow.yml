name: CI/CD - Run Tests & Build Project

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 5 * * *"  # run daily at 5 AM (UTC)

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) so queued matrix
# jobs don't stack up against the org's concurrent-runner limit. The event name is
# part of the group because the nightly schedule runs on the default branch ref and
# would otherwise cancel (or be cancelled by) a push run on that same branch.
# Only PR runs are cancelled; push and schedule runs are always allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  build:
    name: build (${{ matrix.unity_version }}, ${{ matrix.target_platform }}, ${{ matrix.dotnet_version }}, ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Testing every version x platform x dotnet_version combination would explode
      # the job count. Instead we pick a representative subset: one Android IL2CPP
      # config per Unity version, alternating API compatibility so both NET_4_x and
      # STANDARD_2_x are still exercised.
      #
      # Video-specific constraints vs stream-chat-unity:
      # - Floor is 2021.3 (package.json). Vendored Google.Protobuf needs C# 9.
      # - compiler is always il2cpp (Unity WebRTC requires it; no Mono).
      # - iOS stays off: ubuntu/ios fails Unity's build post-process cp (PBE-5316).
      # - testMode is `all` because this repo has both Editor and Runtime tests.
      # Patch releases must be public LTS/tech builds from the Unity archive, not
      # Extended LTS (xLTS) patches that require Industry/Enterprise licenses in CI.
      # dataset_index must be unique per row and within 0-15 (test data set count).
      matrix:
        include:
          - { unity_version: "2021.3", target_platform: android, dotnet_version: STANDARD_2_x, compiler: il2cpp, dataset_index: 0, image: "unityci/editor:ubuntu-2021.3.36f1-android-3.1.0" }
          - { unity_version: "2022.3", target_platform: android, dotnet_version: NET_4_x, compiler: il2cpp, dataset_index: 1, image: "unityci/editor:ubuntu-2022.3.62f2-android-3.2.2" }
          - { unity_version: "2023.2", target_platform: android, dotnet_version: STANDARD_2_x, compiler: il2cpp, dataset_index: 2, image: "unityci/editor:ubuntu-2023.2.20f1-android-3.2.2" }
          - { unity_version: "6000.0", target_platform: android, dotnet_version: NET_4_x, compiler: il2cpp, dataset_index: 3, image: "unityci/editor:ubuntu-6000.0.63f1-android-3.2.2" }
          - { unity_version: "6000.1", target_platform: android, dotnet_version: STANDARD_2_x, compiler: il2cpp, dataset_index: 4, image: "unityci/editor:ubuntu-6000.1.17f1-android-3.2.2" }
          - { unity_version: "6000.2", target_platform: android, dotnet_version: NET_4_x, compiler: il2cpp, dataset_index: 5, image: "unityci/editor:ubuntu-6000.2.12f1-android-3.2.2" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Test Data Set Index
        run: |
          echo "SEQUENTIAL_INDEX=${{ matrix.dataset_index }}" >> $GITHUB_ENV

      - name: Print Sequential Index
        run: |
          echo "Sequential Index: $SEQUENTIAL_INDEX"

      - name: Install Git
        run: git config --global --add safe.directory /github/workspace

      - name: Free Disk space
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          dotnet: false

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libxtst6 libgtk-3-0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask adoptopenjdk
          brew install gtk+3

      - name: Determine Docker Image
        id: dockerImageSelector
        run: |
          echo "DOCKER_TAG=${{ matrix.image }}" >> $GITHUB_ENV

      - name: Echo Docker Image
        run: |
          echo ${{ env.DOCKER_TAG }}

      - name: Determine Build Name
        run: |
          RUNNER_ID="${{ matrix.unity_version }}_${{ matrix.target_platform }}_${{ matrix.compiler }}_${{ matrix.dotnet_version }}"

          if [ "${{ matrix.target_platform }}" == "android" ]; then
            BUILD_NAME="${RUNNER_ID}.apk"
          elif [ "${{ matrix.target_platform }}" == "ios" ]; then
            BUILD_NAME="${RUNNER_ID}.ipa"
          else
            echo "Unsupported platform"
            exit 1
          fi

          echo "RUNNER_ID=$RUNNER_ID" >> $GITHUB_ENV
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV

      - name: Enable Tests
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildMethod: StreamVideo.EditorTools.StreamEditorTools.EnableStreamTestsEnabledCompilerFlag
          customImage: ${{ env.DOCKER_TAG }}
          allowDirtyBuild: true

      # Editor + Runtime assemblies. Chat is editmode-only; do not copy that.
      - name: Run Tests (Attempt 1)
        id: run_tests_1
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          customParameters: -streamBase64TestDataSet "${{ secrets.STREAM_AUTH_TEST_DATA_BASE64 }}" -testDataSetIndex ${{ env.SEQUENTIAL_INDEX }}
          customImage: ${{ env.DOCKER_TAG }}
          allowDirtyBuild: true
        timeout-minutes: 40
        continue-on-error: true

      - name: Reset Unity state before retry 2
        if: steps.run_tests_1.outcome == 'failure'
        run: bash .github/workflows/scripts/reset-unity-state.sh

      - name: Run Tests (Attempt 2)
        id: run_tests_2
        if: steps.run_tests_1.outcome == 'failure'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          customParameters: -streamBase64TestDataSet "${{ secrets.STREAM_AUTH_TEST_DATA_BASE64 }}" -testDataSetIndex ${{ env.SEQUENTIAL_INDEX }}
          customImage: ${{ env.DOCKER_TAG }}
          allowDirtyBuild: true
        timeout-minutes: 50
        continue-on-error: true

      - name: Reset Unity state before retry 3
        if: steps.run_tests_2.outcome == 'failure'
        run: bash .github/workflows/scripts/reset-unity-state.sh

      - name: Run Tests (Attempt 3)
        id: run_tests_3
        if: steps.run_tests_2.outcome == 'failure'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          customParameters: -streamBase64TestDataSet "${{ secrets.STREAM_AUTH_TEST_DATA_BASE64 }}" -testDataSetIndex ${{ env.SEQUENTIAL_INDEX }}
          customImage: ${{ env.DOCKER_TAG }}
          allowDirtyBuild: true
        timeout-minutes: 60

      - name: Upload Test Results as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test_Results_${{ env.RUNNER_ID }}
          path: artifacts

      - name: Verify tests actually ran
        run: |
          bash .github/workflows/scripts/assert-tests-ran.sh artifacts/editmode-results.xml
          bash .github/workflows/scripts/assert-tests-ran.sh artifacts/playmode-results.xml

      - name: Free Disk space
        uses: jlumbroso/free-disk-space@v1.2.0
        if: matrix.target_platform == 'android' || matrix.target_platform == 'ios'
        with:
          dotnet: false

      - name: List changes
        run: |
          git diff

      - name: Build Sample Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildMethod: StreamVideo.EditorTools.StreamEditorTools.BuildSampleApp
          customParameters: -streamBase64TestDataSet ${{ secrets.STREAM_AUTH_TEST_DATA_BASE64 }} -testDataSetIndex ${{ env.SEQUENTIAL_INDEX }} -apiCompatibility ${{ matrix.dotnet_version }} -scriptingBackend ${{ matrix.compiler }} -buildTargetPlatform ${{ matrix.target_platform }} -buildTargetPath SampleAppBuild/${{ env.BUILD_NAME }}
          customImage: ${{ env.DOCKER_TAG }}
          allowDirtyBuild: true #Needed because the import process may update ProjectSettings

      - name: Upload Build as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ env.BUILD_NAME }}
          path: ${{ github.workspace }}/SampleAppBuild/${{ env.BUILD_NAME }}

      - name: Notify Slack if failed
        uses: voxmedia/github-action-slack-notify-build@v1
        if: always() && failure()
        with:
          channel_id: C07KW7ZCJ6T
          color: danger
          status: FAILED
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
